name: Health API CD Pipeline

on:
  workflow_run:
    workflows: ["Health API CI Pipeline"]
    types: [completed]
    branches: [master, main]

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Check SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "ERROR: $v kosong"; exit 1; fi
          done
          echo "Semua secret tersedia"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/cd-int/healt-api
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps