
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: health-backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: health-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
